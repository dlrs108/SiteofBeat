<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyScript 4.1.0 适配版</title>
<!-- 引入 iink-ts 的 CSS（确保有默认样式） -->
<link rel="stylesheet" href="https://unpkg.com/iink-ts@4.1.0/dist/iink.min.css">
<style>
  body { font-family: -apple-system, sans-serif; padding: 12px; background: #f5f5f5; margin: 0; }
  #status {
    padding: 12px; border-radius: 8px; margin-bottom: 12px;
    background: #1e1e1e; color: #4ade80; font-size: 13px;
    word-break: break-all; white-space: pre-wrap; line-height: 1.6;
    max-height: 45vh; overflow-y: auto;
  }
  #status.err { color: #ff6b6b; }
  #editor { width: 100%; height: 300px; border: 2px solid #ccc; border-radius: 8px; background: #fff; touch-action: none; }
</style>
</head>
<body>
<div id="status">🔍 准备中...</div>
<div id="editor"></div>

<script>
const statusEl = document.getElementById('status');
const editorEl = document.getElementById('editor');
const logs = [];
function log(msg, isError) {
  logs.push((isError ? '❌ ' : '') + msg);
  statusEl.textContent = logs.join('\n');
  statusEl.classList.toggle('err', !!isError);
  statusEl.scrollTop = statusEl.scrollHeight;
}

window.addEventListener('error', e => log('全局错误: ' + (e.message || e.error), true));
window.addEventListener('unhandledrejection', e => {
  const r = e.reason;
  log('Promise 异常: ' + (r instanceof Error ? r.message : JSON.stringify(r)), true);
});

const CDN_LIST = [
  'https://unpkg.com/iink-ts@4.1.0/dist/iink.min.js',
  'https://cdn.jsdelivr.net/npm/iink-ts@4.1.0/dist/iink.min.js'
];

function loadScript(url) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('脚本加载失败'));
    document.head.appendChild(s);
  });
}

async function loadLibrary() {
  for (let i = 0; i < CDN_LIST.length; i++) {
    const url = CDN_LIST[i];
    const host = new URL(url).host;
    log(`📥 [${i + 1}/${CDN_LIST.length}] 尝试加载: ${host}`);
    try {
      await loadScript(url);
      if (typeof iink !== 'undefined') {
        log('✅ 库加载成功！来源: ' + host);
        return true;
      }
      log('⚠️ 脚本执行了但未定义 iink，继续下一个源...', true);
    } catch (e) {
      log('❌ ' + e.message + ' (' + host + ')', true);
    }
  }
  return false;
}

// ========== 核心修正：使用 iink.Canvas.load 和 "INTERACTIVE_INK" ==========
async function initEditor() {
  try {
    log('⏳ 正在初始化编辑器 (Canvas.load 模式)...');

    const editor = await iink.Canvas.load(editorEl, "INTERACTIVE_INK", {
      configuration: {
        server: {
          applicationKey: '1585ff1f-605f-4aab-8dfa-662cdcb33856', // ⚠️ 替换
          hmacKey: '830f624d-8249-4e3d-b9db-a1958cfbaac6'             // ⚠️ 替换
        }
      }
    });

    log('🎉 初始化成功！可以开始手写了。');

    if (editor?.canvas?.client?.webSocket) {
      editor.canvas.client.webSocket.addEventListener('close', ev => {
        if (ev.code !== 1000) {
          log(`❌ WebSocket 关闭 code=${ev.code} reason=${ev.reason || '无'}`, true);
        }
      });
    }
  } catch (err) {
    const msg = err?.message || String(err);
    log('❌ 初始化失败: ' + msg, true);
  }
}

(async function main() {
  const ok = await loadLibrary();
  if (!ok) {
    log('\n❌ 所有 CDN 都加载失败。', true);
    return;
  }
  await initEditor();
})();
</script>
</body>
</html>
