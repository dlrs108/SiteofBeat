<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyScript 多CDN自诊断</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 12px; background: #f5f5f5; margin: 0; }
  #status {
    padding: 12px; border-radius: 8px; margin-bottom: 12px;
    background: #1e1e1e; color: #4ade80; font-size: 13px;
    word-break: break-all; white-space: pre-wrap; line-height: 1.6;
    max-height: 45vh; overflow-y: auto;
  }
  #status.err { color: #ff6b6b; }
  #editor { width: 100%; height: 300px; border: 2px solid #ccc; border-radius: 8px; background: #fff; touch-action: none; }
</style>
</head>
<body>
<div id="status">🔍 准备中...</div>
<div id="editor"></div>

<script>
const statusEl = document.getElementById('status');
const editorEl = document.getElementById('editor');
const logs = [];
function log(msg, isError) {
  logs.push((isError ? '❌ ' : '') + msg);
  statusEl.textContent = logs.join('\n');
  statusEl.classList.toggle('err', !!isError);
  statusEl.scrollTop = statusEl.scrollHeight;
}

window.addEventListener('error', e => log('全局错误: ' + (e.message || e.error), true));
window.addEventListener('unhandledrejection', e => {
  const r = e.reason;
  log('Promise 异常: ' + (r instanceof Error ? r.message : JSON.stringify(r)), true);
});

// 备用 CDN 列表：unpkg、国内镜像、jsdelivr
const CDN_LIST = [
  'https://unpkg.com/iink-ts@4.1.0/dist/iink.min.js',
  'https://npm.elemecdn.com/iink-ts@4.1.0/dist/iink.min.js',
  'https://lib.baomitu.com/iink-ts/4.1.0/iink.min.js',
  'https://cdn.jsdelivr.net/npm/iink-ts@4.1.0/dist/iink.min.js'
];

// 附带的网络连通性小测试（仅展示，不阻断）
async function cdnReachabilityTest() {
  log('📡 CDN 连通性测试:');
  for (const url of CDN_LIST) {
    const host = new URL(url).host;
    try {
      const res = await fetch(url, { method: 'HEAD', mode: 'cors' });
      log(`  ${res.ok ? '✅' : '⚠️'} ${host} → HTTP ${res.status}`);
    } catch (e) {
      log(`  ❌ ${host} → ${e.message}`, true);
    }
  }
}

function loadScript(url) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = url;
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('脚本加载失败'));
    document.head.appendChild(s);
  });
}

async function loadLibrary() {
  for (let i = 0; i < CDN_LIST.length; i++) {
    const url = CDN_LIST[i];
    const host = new URL(url).host;
    log(`📥 [${i + 1}/${CDN_LIST.length}] 尝试加载: ${host}`);
    try {
      await loadScript(url);
      if (typeof iink !== 'undefined') {
        log('✅ 库加载成功！来源: ' + host);
        return true;
      }
      log('⚠️ 脚本执行了但未定义 iink，继续下一个源...', true);
    } catch (e) {
      log('❌ ' + e.message + ' (' + host + ')', true);
    }
  }
  return false;
}

async function initEditor() {
  try {
    log('⏳ 正在初始化编辑器...');
    const editor = new iink.Editor(editorEl, {
      configuration: {
        server: {
          applicationKey: '你的ApplicationKey', // ⚠️ 替换成你的
          hmacKey: '你的HMACKey'                // ⚠️ 替换成你的
        }
      }
    });
    await editor.initialize();

    if (editor.canvas && editor.canvas.client && editor.canvas.client.initialized) {
      await editor.canvas.client.initialized.promise;
    }
    log('🎉 初始化成功！可以开始手写了。');

    if (editor.canvas && editor.canvas.client && editor.canvas.client.webSocket) {
      editor.canvas.client.webSocket.addEventListener('close', ev => {
        if (ev.code !== 1000) {
          log(`❌ WebSocket 关闭 code=${ev.code} reason=${ev.reason || '无'}`, true);
        }
      });
    }
  } catch (err) {
    log('❌ 初始化失败: ' + (err && err.message ? err.message : String(err)), true);
  }
}

(async function main() {
  await cdnReachabilityTest();
  const ok = await loadLibrary();
  if (!ok) {
    log('\n❌ 所有 CDN 都加载失败。\n请用平板浏览器直接打开下面任一链接，全选复制内容，保存为 iink.min.js 放同目录，然后把 <script src="..."> 改成 <script src="./iink.min.js">：\nhttps://unpkg.com/iink-ts@4.1.0/dist/iink.min.js', true);
    return;
  }
  await initEditor();
})();
</script>
</body>
</html>
