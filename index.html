<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyScript 4.1.0 Demo 1.0</title>
    
    <link rel="stylesheet" href="https://unpkg.com/iink-ts@4.1.0/dist/iink.min.css">
    
    <style>
        body { font-family: -apple-system, sans-serif; padding: 12px; background: #f5f5f5; margin: 0; }
        #status { padding: 12px; border-radius: 8px; margin-bottom: 12px; background: #1e1e1e; color: #4ade80; font-size: 13px; word-break: break-all; white-space: pre-wrap; line-height: 1.6; max-height: 30vh; overflow-y: auto; }
        #status.err { color: #ff6b6b; }
        #editor { width: 100%; height: 300px; border: 2px solid #ccc; border-radius: 8px; background: #fff; overflow: hidden; touch-action: none; margin-bottom: 12px; }
        
        #toolbar { display: flex; gap: 8px; margin-bottom: 12px; }
        #toolbar button { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; font-size: 14px; cursor: pointer; }
        #toolbar button.active { background: #007bff; color: #fff; border-color: #007bff; }
        
        #result-box { padding: 12px; border-radius: 8px; background: #fff; border: 1px solid #ddd; min-height: 40px; }
        #result-content { font-size: 15px; color: #333; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div id="status">🔍 正在启动引擎...</div>

    <div id="toolbar">
        <button id="btn-text" class="active" onclick="switchRecognition('Text')">📝 文本</button>
        <button id="btn-math" onclick="switchRecognition('Math')">🧮 数学</button>
        <button id="btn-drawing" onclick="switchRecognition('Drawing')">🎨 绘图</button>
    </div>

    <div id="editor"></div>

    <div id="result-box">
        <strong>识别结果：</strong>
        <div id="result-content"></div>
    </div>

    <script>
        try {
            const originalValues = Set.prototype.values;
            Set.prototype.values = function() {
                const iterator = originalValues.call(this);
                if (typeof iterator.toArray === 'function') return iterator;
                return new Proxy(iterator, {
                    get(target, prop) {
                        if (prop === 'toArray') return () => Array.from(target);
                        const val = target[prop];
                        return typeof val === 'function' ? val.bind(target) : val;
                    }
                });
            };
        } catch (e) {
            console.warn('Polyfill 注入失败', e);
        }

        const statusEl = document.getElementById('status');
        const editorEl = document.getElementById('editor');
        const resultContent = document.getElementById('result-content');
        const logs = [];

        function log(msg, isError) {
            logs.push((isError ? '❌ ' : '') + msg);
            statusEl.textContent = logs.join('\n');
            statusEl.classList.toggle('err', !!isError);
            statusEl.scrollTop = statusEl.scrollHeight;
        }

        log('🏁 脚本开始执行，环境检查完毕。');

        window.addEventListener('error', e => log('全局错误: ' + (e.message || e.error), true));
        window.addEventListener('unhandledrejection', e => {
            const r = e.reason;
            log('Promise 异常: ' + (r instanceof Error ? r.message : JSON.stringify(r)), true);
        });

        const CDN_LIST = [
            'https://unpkg.com/iink-ts@4.1.0/dist/iink.min.js',
            'https://cdn.jsdelivr.net/npm/iink-ts@4.1.0/dist/iink.min.js'
        ];

        function loadScript(url) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = url;
                s.onload = () => resolve();
                s.onerror = () => reject(new Error('脚本加载失败'));
                document.head.appendChild(s);
            });
        }

        async function loadLibrary() {
            for (let i = 0; i < CDN_LIST.length; i++) {
                const url = CDN_LIST[i];
                const host = new URL(url).host;
                log(`📥 [${i + 1}/${CDN_LIST.length}] 尝试加载: ${host}`);
                try {
                    await loadScript(url);
                    if (typeof iink !== 'undefined') {
                        log('✅ 库加载成功！来源: ' + host);
                        return true;
                    }
                } catch (e) {
                    log('❌ ' + e.message + ' (' + host + ')', true);
                }
            }
            return false;
        }

        let currentType = 'Text';
        let canvas = null;

        window.switchRecognition = async function(type) {
            currentType = type;
            document.querySelectorAll('#toolbar button').forEach(btn => btn.classList.remove('active'));
            const btn = document.getElementById(`btn-${type.toLowerCase()}`);
            if (btn) btn.classList.add('active');
            log(`🔄 切换识别类型: ${type}，正在重新初始化...`);
            await initEditor(); 
        };

        // 自动测试后端接口
async function testBackend() {
    log('🧪 正在测试后端接口 /api/hmac ...');
    try {
        const res = await fetch('/api/hmac', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ challenge: 'test_challenge' })
        });
        
        const text = await res.text();
        if (text.trim().startsWith('<!DOCTYPE html>')) {
            log('❌ 后端未生效！Cloudflare 返回了 HTML 页面（可能是路径错误或没部署）。', true);
        } else {
            log('✅ 后端返回状态: ' + res.status + '\n内容: ' + text);
        }
    } catch (e) {
        log('❌ 请求后端失败: ' + e.message, true);
    }
}
// 页面加载时执行
testBackend();

        async function initEditor() {
            try {
                if (canvas) {
                    canvas.destroy();
                    canvas = null;
                }
                
                log(`⏳ 正在初始化编辑器 (类型: ${currentType})...`);

                canvas = await iink.Canvas.load(editorEl, "INTERACTIVE_INK", {
                    configuration: {
                        server: {
                            applicationKey: '1585ff1f-605f-4aab-8dfa-662cdcb33856',
                            hmacKey: 'placeholder', // 骗过库的校验
                            hmac: async (challenge) => {
                                log('🔑 正在请求后端计算 HMAC 签名...');
                                try {
                                    const response = await fetch('/api/hmac', {
                                        method: 'POST',
                                        headers: { 'Content-Type': 'application/json' },
                                        body: JSON.stringify({ challenge })
                                    });
                                    
                                    if (!response.ok) {
                                        throw new Error(`后端接口报错: ${response.status}`);
                                    }
                                    
                                    const data = await response.json();
                                    log('✅ 签名获取成功');
                                    return data.hmac;
                                } catch (err) {
                                    log('❌ 获取签名失败: ' + err.message, true);
                                    throw err;
                                }
                            },
                            websocket: {
                                autoReconnect: true,
                                maxRetryCount: 10,
                                pingEnabled: true,
                                pingDelay: 30000
                            }
                        },
                        recognition: {
                            type: currentType
                        }
                    }
                });

                log('🎉 初始化成功！可以开始手写了。');

                canvas.event.addEventListener("exported", (event) => {
                    const jiixData = event.detail?.["application/vnd.myscript.jiix"];
                    if (jiixData && jiixData.elements) {
                        let extractedText = [];
                        jiixData.elements.forEach(element => {
                            if (element.label) {
                                extractedText.push(element.label);
                            } else if (element.words) {
                                extractedText.push(element.words.map(w => w.label).join(''));
                            }
                        });

                        const finalResult = extractedText.join('\n');
                        if (finalResult.trim()) {
                            resultContent.textContent = finalResult;
                            log('✅ 识别结果已更新:\n' + finalResult);
                        } else {
                            resultContent.textContent = '（未识别到内容）';
                            log('⚠️ JIIX 数据存在，但未找到标签文字。', true);
                        }
                    }
                });

                if (canvas?.canvas?.client?.webSocket) {
                    canvas.canvas.client.webSocket.addEventListener('close', ev => {
                        if (ev.code !== 1000) {
                            log(`❌ WebSocket 关闭 code=${ev.code}`, true);
                            if (ev.code === 1006 || ev.code === 1001) {
                                log('🔄 检测到异常断开，5秒后尝试重新初始化...', true);
                                setTimeout(() => {
                                    initEditor();
                                }, 5000);
                            }
                        }
                    });
                }

            } catch (err) {
                const msg = err?.message || String(err);
                log('❌ 初始化失败: ' + msg, true);
            }
        }
          
        (async function main() {
            const ok = await loadLibrary();
            if (!ok) {
                log('\n❌ 所有 CDN 都加载失败。', true);
                return;
            }
            await initEditor();
        })();
    </script>
    
    <script src="https://trtc.io/knocket-sdk/sdk.js?identifier=a014f4b80c9e932cd3&v=1792628861818" async></script>
</body>
</html>
