<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyScript 4.1.0 Demo 1.0</title>
    
    <link rel="stylesheet" href="https://unpkg.com/iink-ts@4.1.0/dist/iink.min.css">
    
    <style>
        body { 
            font-family: -apple-system, sans-serif; 
            padding: 12px; 
            background: #f5f5f5; 
            margin: 0; 
        }

        #status { 
            padding: 12px; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            background: #1e1e1e; 
            color: #4ade80; 
            font-size: 13px; 
            word-break: break-all; 
            white-space: pre-wrap; 
            line-height: 1.6; 
            max-height: 30vh; 
            overflow-y: auto; 
        }

        #status.err { 
            color: #ff6b6b; 
        }

        #editor {
            width: 100%;
            height: 300px;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: #fff;
            overflow: hidden;
            touch-action: none;
            margin-bottom: 12px;
        }
          
        /* 工具栏样式 */
        #toolbar { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 12px; 
        }

        #toolbar button { 
            flex: 1; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            background: #fff; 
            font-size: 14px; 
            cursor: pointer; 
        }

        #toolbar button.active { 
            background: #007bff; 
            color: #fff; 
            border-color: #007bff; 
        }

        /* 输出结果样式 */
        #result-box { 
            padding: 12px; 
            border-radius: 8px; 
            background: #fff; 
            border: 1px solid #ddd; 
            min-height: 40px; 
        }

        #result-content { 
            font-size: 15px; 
            color: #333; 
            white-space: pre-wrap; 
        }
    </style>
</head>
<body>
    <div id="status">🔍 准备中...</div>

    <!-- 工具栏 -->
    <div id="toolbar">
        <button id="btn-text" class="active" onclick="switchRecognition('Text')">📝 文本</button>
        <button id="btn-math" onclick="switchRecognition('Math')">🧮 数学</button>
        <button id="btn-drawing" onclick="switchRecognition('Drawing')">🎨 绘图</button>
    </div>

    <!-- 编辑器 -->
    <div id="editor"></div>

    <!-- 输出区域 -->
    <div id="result-box">
        <strong>识别结果：</strong>
        <div id="result-content"></div>
    </div>

    <script>
        // =========================================================
        // 1. 修复平板浏览器不支持 Set.toArray 的 Polyfill（必须放在最前）
        // =========================================================
        if (typeof Set !== 'undefined' && Set.prototype.values && !Set.prototype.values().toArray) {
            Set.prototype.values = (function(originalValues) {
                return function() {
                    const iterator = originalValues.call(this);
                    iterator.toArray = function() {
                        const arr = [];
                        let result = this.next();
                        while (!result.done) {
                            arr.push(result.value);
                            result = this.next();
                        }
                        return arr;
                    };
                    return iterator;
                };
            })(Set.prototype.values);
        }

        // =========================================================
        // 2. 基础变量与日志工具
        // =========================================================
        const statusEl = document.getElementById('status');
        const editorEl = document.getElementById('editor');
        const resultContent = document.getElementById('result-content');
        const logs = [];

        function log(msg, isError) {
            logs.push((isError ? '❌ ' : '') + msg);
            statusEl.textContent = logs.join('\n');
            statusEl.classList.toggle('err', !!isError);
            statusEl.scrollTop = statusEl.scrollHeight;
        }

        window.addEventListener('error', e => log('全局错误: ' + (e.message || e.error), true));
        window.addEventListener('unhandledrejection', e => {
            const r = e.reason;
            log('Promise 异常: ' + (r instanceof Error ? r.message : JSON.stringify(r)), true);
        });

        // =========================================================
        // 3. 动态加载库 (带 CDN 降级)
        // =========================================================
        const CDN_LIST = [
            'https://unpkg.com/iink-ts@4.1.0/dist/iink.min.js',
            'https://cdn.jsdelivr.net/npm/iink-ts@4.1.0/dist/iink.min.js'
        ];

        function loadScript(url) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = url;
                s.onload = () => resolve();
                s.onerror = () => reject(new Error('脚本加载失败'));
                document.head.appendChild(s);
            });
        }

        async function loadLibrary() {
            for (let i = 0; i < CDN_LIST.length; i++) {
                const url = CDN_LIST[i];
                const host = new URL(url).host;
                log(`📥 [${i + 1}/${CDN_LIST.length}] 尝试加载: ${host}`);
                try {
                    await loadScript(url);
                    if (typeof iink !== 'undefined') {
                        log('✅ 库加载成功！来源: ' + host);
                        return true;
                    }
                    log('⚠️ 脚本执行了但未定义 iink，继续下一个源...', true);
                } catch (e) {
                    log('❌ ' + e.message + ' (' + host + ')', true);
                }
            }
            return false;
        }

        // =========================================================
        // 4. 核心业务逻辑
        // =========================================================
        let currentType = 'Text';
        let canvas = null;

        // 切换识别类型
        window.switchRecognition = async function(type) {
            currentType = type;
            document.querySelectorAll('#toolbar button').forEach(btn => btn.classList.remove('active'));
            const btn = document.getElementById(`btn-${type.toLowerCase()}`);
            if (btn) btn.classList.add('active');
            
            log(`🔄 切换识别类型: ${type}，正在重新初始化...`);
            await initEditor(); 
        };

        // 初始化编辑器
        async function initEditor() {
            try {
                if (canvas) {
                    canvas.destroy();
                    canvas = null;
                }
                
                log(`⏳ 正在初始化编辑器 (类型: ${currentType})...`);

                canvas = await iink.Canvas.load(editorEl, "INTERACTIVE_INK", {
                    configuration: {
                        server: {
                            applicationKey: '1585ff1f-605f-4aab-8dfa-662cdcb33856',
                            hmacKey: '830f624d-8249-4e3d-b9db-a1958cfbaac6',
                            // 增强 WebSocket 重连配置
                            websocket: {
                                autoReconnect: true,
                                maxRetryCount: 10,
                                pingEnabled: true,
                                pingDelay: 30000
                            }
                        },
                        recognition: {
                            type: currentType
                        }
                    }
                });

                log('🎉 初始化成功！可以开始手写了。');

                // 监听识别结果
                canvas.event.addEventListener("exported", (event) => {
                    const jiixData = event.detail?.["application/vnd.myscript.jiix"];
                    
                    if (jiixData && jiixData.elements) {
                        let extractedText = [];
                        
                        jiixData.elements.forEach(element => {
                            if (element.label) {
                                extractedText.push(element.label);
                            } else if (element.words) {
                                const wordsText = element.words.map(w => w.label).join('');
                                extractedText.push(wordsText);
                            }
                        });

                        const finalResult = extractedText.join('\n');
                        
                        if (finalResult.trim()) {
                            resultContent.textContent = finalResult;
                            log('✅ 识别结果已更新:\n' + finalResult);
                        } else {
                            resultContent.textContent = '（未识别到内容）';
                            log('⚠️ JIIX 数据存在，但未找到标签文字。', true);
                        }
                    } else {
                        log('⚠️ 收到的不是标准的 JIIX 格式，未找到 elements。', true);
                    }
                });

                // 监听连接状态：处理断开与重连
                if (canvas?.canvas?.client?.webSocket) {
                    canvas.canvas.client.webSocket.addEventListener('close', ev => {
                        if (ev.code !== 1000) {
                            log(`❌ WebSocket 关闭 code=${ev.code} reason=${ev.reason || '无'}`, true);
                            // 异常断开重连兜底
                            if (ev.code === 1006 || ev.code === 1001) {
                                log('🔄 检测到异常断开，5秒后尝试重新初始化...', true);
                                setTimeout(() => {
                                    log('🔄 正在执行重连...');
                                    initEditor();
                                }, 5000);
                            }
                        }
                    });
                }

            } catch (err) {
                const msg = err?.message || String(err);
                log('❌ 初始化失败: ' + msg, true);
            }
        }
          
        // 启动程序
        (async function main() {
            const ok = await loadLibrary();
            if (!ok) {
                log('\n❌ 所有 CDN 都加载失败。', true);
                return;
            }
            await initEditor();
        })();
    </script>

    <!-- 第三方实时通讯 SDK 放在 body 最底部 -->
    <script src="https://trtc.io/knocket-sdk/sdk.js?identifier=a014f4b80c9e932cd3&v=1792628861818" async></script>
</body>
</html>
