<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
        h1 { font-size: 2.5rem; margin-bottom: 2rem; background: linear-gradient(90deg, #38bdf8, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: #1e293b; border-radius: 1rem; padding: 2rem; max-width: 600px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card h2 { margin-bottom: 1rem; color: #38bdf8; }
        .btn { display: inline-block; background: linear-gradient(90deg, #38bdf8, #a78bfa); color: #0f172a; padding: 0.8rem 2rem; border-radius: 999px; text-decoration: none; font-weight: bold; border: none; cursor: pointer; margin-top: 1rem; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.05); }
        #editor { width: 100%; height: 300px; background: white; border-radius: 0.5rem; touch-action: none; cursor: crosshair; }
        #result { margin-top: 1rem; font-size: 1.2rem; color: #38bdf8; min-height: 1.5rem; }
    </style>
</head>
<body>
    <h1>欢迎来到我的个人主页</h1>
    <div class="card">
        <h2>手写识别（安全模式）</h2>
        <p style="margin-bottom: 1rem; color: #94a3b8;">在下面写字，然后点击识别。密钥由后端安全保管。</p>
        
        <canvas id="editor"></canvas>
        <button class="btn" id="recognizeBtn">🔍 开始识别</button>
        <div id="result">识别结果将显示在这里...</div>
    </div>

    <script>
    const canvas = document.getElementById('editor');
    const ctx = canvas.getContext('2d');
    const resultDiv = document.getElementById('result');
    const btn = document.getElementById('recognizeBtn');

    let strokes = [];
    let currentStroke = null;

    const resizeCanvas = () => {
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#000';
    };
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    };

    const startDraw = (e) => {
        e.preventDefault();
        const pos = getPos(e);
        currentStroke = [{ x: pos.x, y: pos.y, t: Date.now() }];
        strokes.push(currentStroke);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
    };

    const draw = (e) => {
        if (!currentStroke) return;
        e.preventDefault();
        const pos = getPos(e);
        currentStroke.push({ x: pos.x, y: pos.y, t: Date.now() });
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
    };

    const endDraw = () => {
        currentStroke = null;
    };

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', endDraw);
    canvas.addEventListener('mouseleave', endDraw);
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', endDraw);

    btn.addEventListener('click', async () => {
        if (strokes.length === 0) {
            resultDiv.innerText = '请先写点什么吧！';
            return;
        }

        resultDiv.innerText = '识别中...';
        btn.disabled = true;

        try {
            const response = await fetch('/api/MyScript_recognize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    strokes: strokes,
                    width: canvas.width,
                    height: canvas.height
                })
            });

            // 先检查状态码，如果不是 200，就把响应体当纯文本读出来
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`HTTP ${response.status}: ${errorText}`);
            }

            const data = await response.json();
            
            if (data.error) {
                resultDiv.innerText = '❌ 识别失败：' + data.error;
            } else {
                resultDiv.innerText = '识别结果：' + (data.text || '未识别出文字');
            }
        } catch (err) {
            resultDiv.innerText = '❌ 网络错误：' + err.message;
        } finally {
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
